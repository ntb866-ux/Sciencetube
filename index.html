<style>
/* Layout: video-site shell (top bar, collapsible rail, chip row, card grid, watch page with related column).
   Identity: a university-press reading room. Source Serif 4 for titles and descriptions, Be Vietnam Pro for UI, mono for durations. */
:root{
  --bg:#faf9f5; --bg2:#f0eee6; --bg3:#e8e6dc; --fg:#141413; --muted:#6b6a63; --line:#e5e2d8;
  --accent:#0f6b5a; --accent-ink:#ffffff; --accent-soft:#e3ece4; --lab:#b8562f; --hover:rgba(20,20,19,.05);
  --overlay:rgba(10,14,12,.5); --thumb:#1c2220;
  --f-title:"Source Serif 4","Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --top:56px; --rail:240px; --mini:72px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --bg2:#30302e; --bg3:#3b3a37; --fg:#faf9f5; --muted:#b0aea5; --line:#3d3c38;
  --accent:#5cc9ac; --accent-ink:#06231b; --accent-soft:#183a31; --lab:#efa25d; --hover:rgba(255,255,255,.08);
  --overlay:rgba(0,0,0,.65); --thumb:#0a0d0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --bg2:#30302e; --bg3:#3b3a37; --fg:#faf9f5; --muted:#b0aea5; --line:#3d3c38;
  --accent:#5cc9ac; --accent-ink:#06231b; --accent-soft:#183a31; --lab:#efa25d; --hover:rgba(255,255,255,.08);
  --overlay:rgba(0,0,0,.65); --thumb:#0a0d0c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--top);display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.start,.end{display:flex;align-items:center;gap:4px;flex:none}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--hover)}
.logo{display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;height:40px}
.mark{width:28px;height:20px;border-radius:6px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:14px;height:14px;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.word{font-family:var(--f-title);font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1}
.word i{font-style:italic;font-weight:400;color:var(--accent)}
.vn{font-size:10px;color:var(--muted);align-self:flex-start;margin-top:8px;letter-spacing:.04em}
.center{flex:0 1 728px;display:flex;align-items:center;gap:12px;min-width:0}
.search{flex:1;display:flex;min-width:0;height:40px}
.search input{flex:1;min-width:0;border:1px solid var(--bg3);border-right:0;border-radius:20px 0 0 20px;padding:0 4px 0 16px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.search button{width:64px;border:1px solid var(--bg3);border-radius:0 20px 20px 0;background:var(--bg2);display:grid;place-items:center}
.search button:hover{background:var(--bg3)}
.search svg{width:22px;height:22px}

/* ---------- shell + rail ---------- */
.shell{display:flex}
.rail{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));align-self:flex-start;height:calc(100vh - var(--top));overflow-y:auto;flex:none;width:var(--rail);
  padding:4px 12px 24px max(12px,env(safe-area-inset-left,0px));scrollbar-width:thin}
.ri{display:flex;align-items:center;gap:24px;height:40px;padding:0 12px;border-radius:10px;width:100%;text-align:left;font-size:14px}
.ri:hover{background:var(--hover)}
.ri[aria-current="true"]{background:var(--bg2);font-weight:600}
.ri .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.rail h3{font-family:var(--f-title);font-size:17px;font-weight:500;margin:4px 12px 4px;display:flex;align-items:center;gap:6px}
.rail hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.subj{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-title);font-weight:700;font-size:12px;background:var(--bg2)}
.rail .foot{font-size:12px;color:var(--muted);padding:0 12px;line-height:1.55}
.rail .foot b{font-weight:600;color:var(--fg)}
/* mini rail */
.mini{display:none;flex:none;width:var(--mini);position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));align-self:flex-start;padding:4px 4px 0 max(4px,env(safe-area-inset-left,0px))}
.mi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 14px;border-radius:10px;width:100%;font-size:10px}
.mi:hover{background:var(--hover)}
.mi[aria-current="true"] svg{stroke-width:2.3}
body.rail-mini .rail{display:none} body.rail-mini .mini{display:block}
@media (max-width:1312px){ body:not(.rail-full) .rail{display:none} body:not(.rail-full) .mini{display:block} }
@media (max-width:792px){ .mini{display:none!important} }
/* drawer (narrow screens, and always on the watch page) */
body.drawer .rail{display:block!important;position:fixed;left:0;top:0;bottom:0;height:100vh;height:100dvh;z-index:70;background:var(--bg);padding-top:calc(8px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
.dscrim{position:fixed;inset:0;background:var(--overlay);z-index:199}
.drawer-head{display:none;align-items:center;gap:4px;height:48px;margin-bottom:4px}
body.drawer .drawer-head{display:flex}
body.watching .rail,body.watching .mini{display:none}

main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* ---------- chips ---------- */
.chipbar{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0}
.chips{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:8px;background:var(--bg2);font-size:14px;font-weight:500;white-space:nowrap}
.chip:hover{background:var(--bg3)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip.lab[aria-pressed="true"]{background:var(--lab);color:#fff}
.chipnav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.chipnav:hover{background:var(--hover)}
.chipnav svg{width:20px;height:20px}
.fbtn{flex:none;height:32px;padding:0 12px 0 8px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;gap:6px;font-weight:500}
.fbtn svg{width:20px;height:20px}
.fbtn[aria-expanded="true"]{background:var(--bg3)}
.fpanel{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 24px;padding:4px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.fpanel h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg);margin:8px 0 6px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.fopt{display:block;width:100%;text-align:left;padding:6px 0;color:var(--muted);font-size:14px}
.fopt:hover{color:var(--fg)}
.fopt[aria-pressed="true"]{color:var(--fg);font-weight:600}

/* ---------- grid ---------- */
.headline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.headline h1{font-family:var(--f-title);font-size:30px;font-weight:500;margin:0;letter-spacing:-.015em;text-wrap:balance}
.headline p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 16px}
@media (max-width:1700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr);gap:28px}}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.thumb{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;background-color:var(--thumb);background-size:1000% 600%;background-repeat:no-repeat;overflow:hidden;transition:border-radius .2s}
.card:hover .thumb{border-radius:0}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-family:var(--f-mono);font-size:12px;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.badge{position:absolute;left:8px;bottom:8px;background:var(--lab);color:#fff;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px}
.seenbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent)}
.row{display:flex;gap:12px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-title);font-weight:700;font-size:15px;color:#fff}
.info{min-width:0;display:flex;flex-direction:column;gap:2px;padding-right:20px}
.ti{font-family:var(--f-title);font-size:17px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px;text-wrap:pretty}
.vi{font-family:var(--f-title);font-size:15px;line-height:1.4;color:var(--fg);opacity:.82;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch,.st{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch{text-align:left;padding:0;justify-self:start}
.ch:hover{color:var(--fg)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.lang{height:36px;padding:0 12px 0 9px;border-radius:18px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;letter-spacing:.04em;margin-right:4px}.lang:hover{background:var(--bg2)}.lang .i{width:20px;height:20px}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--accent-soft)}
.tag.p{font-family:var(--f-ui);background:var(--bg2);font-size:11.5px}
.empty{grid-column:1/-1;padding:72px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-title);font-size:18px;color:var(--fg);margin-bottom:6px}
.sentinel{height:1px}

/* ---------- watch page ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 402px;gap:24px;max-width:1754px;margin:0 auto;padding-top:24px}
@media (max-width:1016px){.watch{grid-template-columns:minmax(0,1fr)}}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background-color:var(--thumb);background-size:1000% 600%;background-repeat:no-repeat}
.thumb img,.player iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.player::after{display:none;content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.playbtn{position:absolute;inset:0;z-index:2;display:grid;place-items:center}
.playbtn span{width:72px;height:50px;border-radius:14px;background:rgba(0,0,0,.72);display:grid;place-items:center;transition:background .15s}
.playbtn:hover span{background:var(--accent)}
.playbtn svg{width:24px;height:24px;fill:#fff}
.pnote{position:absolute;left:16px;bottom:12px;z-index:2;color:#fff;font-size:13px;display:flex;gap:10px;align-items:center}
.pnote .dur{position:static}
.wtitle{font-family:var(--f-title);font-size:28px;font-weight:500;line-height:1.25;margin:12px 0 4px;text-wrap:balance;letter-spacing:-.01em}
.wvi{font-family:var(--f-title);font-style:italic;font-size:17px;color:var(--muted);margin:0 0 12px}
.owner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.owner .who{display:flex;align-items:center;gap:12px;min-width:0}
.owner .av{width:40px;height:40px}
.who b{display:block;font-size:16px;font-weight:600}
.who small{color:var(--muted);font-size:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:36px;padding:0 16px;border-radius:18px;background:var(--bg2);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.pill:hover{background:var(--bg3)}
.pill svg{width:20px;height:20px}
.pill.primary{background:var(--fg);color:var(--bg)}
.pill.primary:hover{opacity:.88}
.desc{background:var(--bg2);border-radius:12px;padding:12px 14px;margin-top:12px;display:grid;gap:12px}
.desc .st{color:var(--fg);font-weight:600;white-space:normal}
.yc{display:grid;gap:10px}
.ycr{display:grid;gap:3px;padding-left:12px;border-left:3px solid var(--accent)}
.ycr .lvl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ych{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 8px}
.ycr .tp{font-family:var(--f-title);font-weight:600;font-size:15px}
.ycr p{margin:0;font-family:var(--f-title);font-size:16px;line-height:1.5;max-width:70ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted)}
.facts b{color:var(--fg);font-weight:600}
.warn{font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:0;color:var(--muted);border:1px dashed var(--line)}
.related{display:flex;flex-direction:column;gap:8px;min-width:0}
.related h2{font-family:var(--f-title);font-size:19px;font-weight:500;margin:0 0 4px}
.rcard{display:grid;grid-template-columns:168px minmax(0,1fr);gap:8px;min-width:0}
.rcard .thumb{border-radius:8px}
.rcard .dur{right:4px;bottom:4px;font-size:11px}
.rcard .ti{font-size:14px;-webkit-line-clamp:2}
.rcard .ch,.rcard .st{font-size:12px}
.rwhy{font-size:12px;color:var(--accent);font-family:var(--f-ui);font-weight:600}
.rwhy{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rwhy.new{color:var(--lab)}
.card .rwhy{margin-top:2px}
.alts{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}.alts a{color:var(--fg);text-decoration:underline;text-underline-offset:2px}
@media (max-width:560px){.rcard{grid-template-columns:minmax(0,1fr)}.wtitle{font-size:19px}.watch{padding-top:0}.player{border-radius:0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}}


.ytmount,.player iframe,.sstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
.sound{position:absolute;left:12px;top:12px;z-index:6;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:18px;background:rgba(0,0,0,.72);color:#fff;font-weight:600;font-size:14px}
.sound svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sound:hover{background:var(--accent);color:var(--accent-ink)}
.shmodal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.shbox{width:min(480px,100%);background:var(--bg);color:var(--fg);border-radius:12px;padding:16px 20px 20px;box-shadow:0 8px 40px rgba(0,0,0,.35)}
.shhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.shhd strong{font-family:var(--f-title);font-size:19px;font-weight:500}
.shx{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}.shx:hover{background:var(--bg2)}.shx svg{width:20px;height:20px;stroke:var(--fg);stroke-width:2;fill:none;stroke-linecap:round}
.shrow{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px}
.sho{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;min-width:64px;color:var(--fg)}
.sho span{width:60px;height:60px;border-radius:50%;display:grid;place-items:center}.sho svg{width:30px;height:30px}.sho:hover span{filter:brightness(1.1)}
.shlink{display:flex;align-items:center;gap:8px;margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;background:var(--bg2)}
.shlink input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;outline:0}
.shlink button{height:36px;padding:0 16px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}
#toast{position:fixed;left:16px;bottom:16px;z-index:110;background:#0f0f0f;color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;max-width:calc(100vw - 32px);opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}#toast.on{opacity:1;transform:none}
@media (max-width:560px){.shmodal{place-items:end stretch;padding:0}.shbox{border-radius:16px 16px 0 0;width:100%}}
/* captions on: keep the caption safe zone clear */
body.cc .sover{padding-top:28px;padding-bottom:10px;background:linear-gradient(transparent,rgba(0,0,0,.5));transition:opacity .4s .3s}
body.cc .sover .svi,body.cc .sover .stags{display:none}
body.cc .sover .sti{-webkit-line-clamp:1;font-size:14px;margin:0}
body.cc .sover .sch{margin-bottom:4px}
body.cc .sitem.on .sover{opacity:0}
body.cc .sitem.on .sstage:hover .sover,body.cc .sitem.on .sover:hover{opacity:1;transition-delay:0s}
/* ---------- shorts shelf (home) ---------- */
.shelf{margin:0 0 36px}
.shelf-h{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.shelf-h h2{font-family:var(--f-title);font-size:24px;font-weight:500;margin:0;letter-spacing:-.01em}
.shelf-h .logo-s{width:26px;height:26px;border-radius:7px;background:var(--lab);display:grid;place-items:center}
.shelf-h .logo-s svg{width:16px;height:16px;fill:#fff}

const DAY=864e5,HALF=7,HIDE=30,LAMBDA=.7;
let R=S.get('st-rec',null);if(!R||R.v!==1)R={v:1,t:{},arm:{},imp:{},w:{}};
const now=()=>Date.now();
const dec=(x,t)=>x*Math.pow(2,-(now()-t)/(HALF*DAY));
function saveR(){
  const t=now(),cut=(o,n,age,ts)=>{let ks=Object.keys(o).filter(k=>t-ts(o[k])<age);if(ks.length>n)ks=ks.sort((a,b)=>ts(o[b])-ts(o[a])).slice(0,n);const r={};ks.forEach(k=>r[k]=o[k]);return r};
  R.w=cut(R.w,600,120*DAY,e=>e[0]);R.imp=cut(R.imp,600,HIDE*DAY,e=>e[1]);R.t=cut(R.t,400,120*DAY,e=>e[1]);R.arm=cut(R.arm,200,120*DAY,e=>e[2]);
  S.set('st-rec',R);
}
const subj=v=>v.bm||(v.a?'KHTN':'');
const tops=v=>{const o=[];if(v.at)o.push('a:'+v.at);if(v.bt)o.push('b:'+v.bt);return o};
const vtags=v=>{const o=tops(v);if(v.a)o.push('ca:'+v.a);if(v.b)o.push('cb:'+v.b);const s=subj(v);if(s)o.push('m:'+s);o.push('c:'+v.c);return o};
const TW=k=>k.startsWith('ca:')||k.startsWith('cb:')?1:k.startsWith('c:')?.3:k.startsWith('m:')?.25:.6;

function sim(u,v){
  let s=0;
  if(u.a&&u.a===v.a||u.b&&u.b===v.b)s+=1;
  if(u.at&&u.at===v.at||u.bt&&u.bt===v.bt)s+=.6;
  const su=subj(u);if(su&&su===subj(v))s+=.25;
  if(u.c===v.c)s+=.3;
  if(u.g.some(g=>v.g.includes(g)))s+=.15;
  if(u.tn===v.tn)s+=.1;
  return s/2.4;
}
const tscore=k=>{const e=R.t[k];return e?dec(e[0],e[1]):0};
function signal(v,r){
  const t=now();
  vtags(v).forEach(k=>{R.t[k]=[tscore(k)+r,t]});
  tops(v).forEach(k=>{const e=R.arm[k];let a=e?dec(e[0],e[2]):0,b=e?dec(e[1],e[2]):0;if(r>0)a+=r;else b-=r;R.arm[k]=[a,b,t]});
}
/* Beta(α,β) = X/(X+Y), X~Gamma(α), Y~Gamma(β) (Marsaglia–Tsang, α ≥ 1) */
function gam(k){const d=k-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{const u1=Math.random()||1e-9,u2=Math.random();x=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);v=1+c*x}while(v<=0);v=v*v*v;const u=Math.random();if(u<1-.0331*x*x*x*x||Math.log(u)<.5*x*x+d*(1-v+Math.log(v)))return d*v}}
function sampleArm(k){const e=R.arm[k],a=1+(e?dec(e[0],e[2]):0),b=1+(e?dec(e[1],e[2]):0),x=gam(a);return x/(x+gam(b))}

const vimg=v=>`<img src="https://i.ytimg.com/vi/${v.id}/oar2.jpg" alt="" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">`;
let SH=[],shOrder=[],shCur=-1,shPanel=false,shIO=null,shelfN=6;
function shortsPool(){return V.filter(v=>v.sh).sort((a,b)=>(b.tn-a.tn)||(b.pr-a.pr)||(b.v-a.v))}
function shelf(show){
  const el=$('#shelf');
  if(!show){el.innerHTML='';return}
  const pool=SH.filter(pass);
  if(!pool.length){el.innerHTML='';return}
  const n=pool.slice(0,shelfN);
  el.innerHTML=`<section class="shelf" aria-label="Shorts"><div class="shelf-h"><span class="logo-s"><svg viewBox="0 0 24 24"><path d="m9 7 9 5-9 5Z"/></svg></span><h2>Shorts</h2></div>
   <div class="shelf-row">${n.map(v=>`<article class="scard"><a class="vthumb" href="#shorts-${v._i}" aria-label="${esc(v.t)}">${vimg(v)}${v.tn?`<span class="badge" style="bottom:auto;top:8px">${tr('Thí nghiệm')}</span>`:''}</a><div class="info" style="padding-right:4px"><a class="ti" href="#shorts-${v._i}">${esc(v.t)}</a><span class="st">${views(v.v)} ${tr('lượt xem')}</span></div></article>`).join('')}</div>
   ${pool.length>shelfN?`<div class="shelf-more"><button id="shMore">${tr('Hiện thêm')}</button></div>`:''}</section>`;
  const b=$('#shMore');if(b)b.onclick=()=>{shelfN+=12;shelf(true)};
}

/* YouTube IFrame API: try to start with sound; if the browser blocks it, start muted and offer "Bật tiếng" */
let ytP=null,soundOn=S.get('st-sound',true),ccOn=S.get('st-cc',false);
/* Captions: YouTube draws them inside its own frame, so we cannot move them. We make them bigger
   (scaled to the player width) and, while they are on, shrink the Shorts info overlay into a thin strip that fades away,
   so the bottom of the video (where captions sit) stays clear. */
function ccSize(el){const w=el.clientWidth;return w<360?1:w<520?2:3}
function applyCC(p,el){try{if(ccOn){p.loadModule('captions');p.setOption('captions','fontSize',ccSize(el))}else{p.unloadModule('captions')}}catch(e){}}
function setCC(on){ccOn=on;S.set('st-cc',on);document.body.classList.toggle('cc',on);
  $$('[data-act="cc"]').forEach(b=>b.setAttribute('aria-pressed',on));
  $$('[data-stage],#wplayer').forEach(el=>{if(el._yt)applyCC(el._yt,el)});
  toast(tr(on?'Đã bật phụ đề (nếu video có phụ đề)':'Đã tắt phụ đề'))}
document.body.classList.toggle('cc',ccOn);
function ytApi(){if(ytP)return ytP;ytP=new Promise(res=>{if(window.YT&&YT.Player)return res();window.onYouTubeIframeAPIReady=()=>res();const t=document.createElement('script');t.src='https://www.youtube.com/iframe_api';document.head.appendChild(t)});return ytP}
function unmountPlayer(el){if(!el)return;if(el._yt){try{el._yt.destroy()}catch(e){}el._yt=null}el.querySelectorAll('.ytmount,.sound').forEach(x=>x.parentNode.removeChild(x))}
function soundBtn(el,pl){
  if(el.querySelector('.sound'))return;
  const b=document.createElement('button');b.className='sound';b.type='button';
  b.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="m17 9 4 6M21 9l-4 6"/></svg>'+tr('Bật tiếng');
  b.onclick=e=>{e.stopPropagation();pl.unMute();pl.setVolume(100);pl.playVideo();soundOn=true;S.set('st-sound',true);b.parentNode.removeChild(b)};
  el.appendChild(b);
}
function mountPlayer(el,v,loop){
  unmountPlayer(el);
  const d=document.createElement('div');d.className='ytmount';el.prepend(d);
  ytApi().then(()=>{
    if(!d.isConnected)return;
    const pv={autoplay:1,playsinline:1,rel:0,modestbranding:1,cc_lang_pref:LANG,hl:LANG};if(ccOn)pv.cc_load_policy=1;
    if(loop){pv.loop=1;pv.playlist=v.id}
    const pl=new YT.Player(d,{host:'https://www.youtube-nocookie.com',videoId:v.id,playerVars:pv,
      events:{
        onReady:e=>{const p=e.target;if(ccOn)applyCC(p,el);if(!soundOn){p.mute();soundBtn(el,p)}p.playVideo();
          setTimeout(()=>{if(el._yt!==p)return;const s=p.getPlayerState();if(s!==1&&s!==3){p.mute();p.playVideo();soundBtn(el,p)}},1500)},
        onApiChange:e=>{if(ccOn)try{e.target.setOption('captions','fontSize',ccSize(el))}catch(x){}},
        onStateChange:e=>{if(e.data===1&&!e.target.isMuted()){const b=el.querySelector('.sound');if(b)b.parentNode.removeChild(b)}}
      }});
    el._yt=pl;
  });
}

const ytEmbed=id=>`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&loop=1&playlist=${id}&rel=0&modestbranding=1`;
function shortsOpen(startIdx){
  document.body.classList.add('shorting');document.body.classList.remove('watching');
  $('#browse').hidden=true;$('#watch').hidden=true;$('#watch').innerHTML='';
  $$('[data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v==='shorts'));
  const pool=SH.filter(pass);
  shOrder=pool.slice();
  if(startIdx!=null){const s=V[startIdx];if(s&&s.sh){shOrder=[s,...pool.filter(x=>x!==s)]}}
  const el=$('#shorts');el.hidden=false;
  if(!shOrder.length){el.innerHTML=`<div class="sempty"><div><strong>${tr('Không có Shorts khớp bộ lọc')}</strong>${tr('Về Trang chủ và chọn “Tất cả”.')}</div></div>`;return}
  el.innerHTML=`<div class="sfeed" id="sfeed">${shOrder.map((v,k)=>shItem(v,k)).join('')}</div>
   <div class="snav"><button id="sUp" aria-label="${tr('Video trước')}"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button><button id="sDn" aria-label="${tr('Video tiếp theo')}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></button></div>`;
  shCur=-1;
  shIO&&shIO.disconnect();
  shIO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)shActivate(+e.target.dataset.k)})},{root:$('#sfeed'),threshold:.6});
  $$('.sitem').forEach(x=>shIO.observe(x));
  shActivate(0);
}
function shItem(v,k){
  const t=[];(v.g||[]).forEach(g=>t.push(`<span>${tr('Lớp')} ${g}</span>`));if(v.tn)t.unshift(`<span class="lab">${tr('Thí nghiệm')}</span>`);
  return `<div class="sitem" data-k="${k}">
   <div class="sstage" data-stage>${vimg(v)}<button class="tap" data-play aria-label="${tr('Phát')}"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></button>
    <div class="sover"><div class="sch">${av(v.c)}<span>${esc(v.c)}</span></div><p class="sti">${esc(v.t)}</p>${LANG==='en'?'':`<p class="svi">${esc(v.ht)}</p>`}<div class="stags">${t.join('')}</div></div></div>
   <div class="sacts">
    <button class="sact" data-act="why" aria-pressed="${shPanel}"><span class="c"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.5M12 16.8v.2"/></svg></span>${tr('Vì sao?')}</button>
    <button class="sact" data-act="cc" aria-pressed="${ccOn}"><span class="c"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M16.5 10.2a2.2 2.2 0 1 0 0 3.6"/></svg></span>${tr('Phụ đề')}</button>
    <button class="sact" data-act="later" aria-pressed="${later.has(v.id)}"><span class="c"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>${tr('Xem sau')}</button>
    <button class="sact" data-act="share"><span class="c"><svg viewBox="0 0 24 24"><path d="M14 5l7 7-7 7M21 12H9a6 6 0 0 0-6 6"/></svg></span><span data-lbl>${tr('Chia sẻ')}</span></button>
    <a class="sact" href="${yt(v)}" target="_blank" rel="noopener"><span class="c"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></span>YouTube</a>
    <span class="sact" aria-hidden="true">${av(v.c)}</span>
   </div>
   ${shPanel?shPanelHTML(v):''}
  </div>`;
}
function shPanelHTML(v){
  const yc=[];
  if(v.a)yc.push(`<div class="ycr"><span class="lvl">${tr('Lớp')} ${esc(v.al)} · ${tr('Khoa học tự nhiên')}</span><span class="tp">${esc(trT(v.at))}</span></div>`);
  if(v.b)yc.push(`<div class="ycr"><span class="lvl">${tr('Lớp')} ${esc(v.bl)} · ${esc(tr(v.bm))}</span><span class="tp">${esc(trT(v.bt))}</span></div>`);
  return `<aside class="spanel" data-panel><header><h3>${tr('Vì sao?')}</h3><button class="ib" data-act="why" aria-label="${tr('Đóng')}"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
   <div class="body"><p class="q">${esc(LANG==='en'?v.t:v.ht)}</p>
   <div class="facts"><span>${tr('Mức độ')} <b>${v.dk?DK[v.dk]:'—'}</b></span><span>${tr('Thời lượng')} <b>${dur(v.d)}</b></span></div>
   ${yc.length?`<h4 class="ych">${tr('Kiến thức liên quan')}</h4><div class="yc">${yc.join('')}</div>`:''}
   <p class="st" style="white-space:normal">${tr('Thử thách: xem một lần không bật tiếng, đoán xem chuyện gì đang xảy ra và vì sao. Sau đó xem lại để kiểm tra dự đoán của bạn.')}</p>
   </div></aside>`;
}
function shActivate(k){
  if(k===shCur||!shOrder[k])return;
  const items=$$('.sitem');
  if(shCur>=0&&items[shCur]){const st0=items[shCur].querySelector('[data-stage]');unmountPlayer(st0);st0.querySelector('[data-play]').hidden=false}
  shCur=k;const v=shOrder[k];
  items.forEach((x,i)=>x.classList.toggle('on',i===k));
  const stg=items[k].querySelector('[data-stage]');
  stg.querySelector('[data-play]').hidden=true;
  mountPlayer(stg,v,true);
  signal(v,.3);saveR();
  seen.add(v.id);S.set('st-seen',[...seen]);counts();
  try{history.replaceState(null,'','#shorts-'+v._i)}catch(e){}
  $('#sUp').disabled=k===0;$('#sDn').disabled=k===shOrder.length-1;
}
function shGo(d){const k=shCur+d;const it=$$('.sitem')[k];if(it)it.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
function shortsClose(){$$('[data-stage]').forEach(unmountPlayer);document.body.classList.remove('shorting');$('#shorts').hidden=true;$('#shorts').innerHTML='';shIO&&shIO.disconnect();shCur=-1}
document.addEventListener('click',e=>{
  if(!document.body.classList.contains('shorting'))return;
  if(e.target.closest('#sUp'))return shGo(-1);
  if(e.target.closest('#sDn'))return shGo(1);
  const it=e.target.closest('.sitem');if(!it)return;
  const k=+it.dataset.k,v=shOrder[k];
  if(e.target.closest('[data-play]')){shCur=-1;shActivate(k);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='why'){shPanel=!shPanel;$$('.sitem').forEach(x=>{const p=x.querySelector('[data-panel]');if(p)p.remove();x.querySelector('[data-act="why"]').setAttribute('aria-pressed',shPanel);if(shPanel)x.insertAdjacentHTML('beforeend',shPanelHTML(shOrder[+x.dataset.k]))})}
  if(act==='cc'){setCC(!ccOn)}
  if(act==='later'){later.has(v.id)?later.delete(v.id):later.add(v.id);S.set('st-later',[...later]);a.setAttribute('aria-pressed',later.has(v.id));counts()}
  if(act==='share'){openShare(v)}
});
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('shorting')||e.target.matches('input,textarea'))return;
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key==='j'){e.preventDefault();shGo(1)}
  if(e.key==='ArrowUp'||e.key==='PageUp'||e.key==='k'){e.preventDefault();shGo(-1)}
});

function route(){
  closeDrawer();recLeave();
  const h0=location.hash.slice(1),h=SLUG_VI[h0]||h0;
  const sm=h.match(/^shorts(?:-(\d+))?$/);
  if(sm){if(shCur>=0&&sm[1]&&shOrder[shCur]&&shOrder[shCur]._i===+sm[1])return;return shortsOpen(sm[1]!=null?+sm[1]:null)}
  shortsClose();
  const m=h.match(/^v-(\d+)$/);
  if(m)return watch(+m[1]);
  document.body.classList.remove('watching');$('#watch').hidden=true;$('#watch').innerHTML='';$('#browse').hidden=false;
  st.view=VIEW[h]?h:'trang-chu';
  $$('[data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v===st.view));
  render();window.scrollTo(0,0);
}
function go(v){const s=slug(v);if(location.hash.slice(1)===s)route();else location.hash=s}
function openDrawer(){document.body.classList.add('drawer');const rl=$('#rail');rl.style.setProperty('display','block','important');rl.style.setProperty('z-index','200','important');const s=document.createElement('div');s.className='dscrim';s.onclick=closeDrawer;document.body.appendChild(s)}
function closeDrawer(){document.body.classList.remove('drawer');const rl=$('#rail');rl.style.removeProperty('display');rl.style.removeProperty('z-index');$$('.dscrim').forEach(x=>x.remove())}

$('#menu').onclick=()=>{
  const narrow=matchMedia('(max-width:792px)').matches;
  if(narrow||document.body.classList.contains('watching')||document.body.classList.contains('shorting'))return openDrawer();
  const mid=matchMedia('(max-width:1312px)').matches;
  if(mid)document.body.classList.toggle('rail-full');else document.body.classList.toggle('rail-mini');
};
document.addEventListener('click',e=>{
  const nv=e.target.closest('[data-v]');if(nv){st.q='';$('#q').value='';go(nv.dataset.v);return}
  if(e.target.closest('[data-close-drawer]'))closeDrawer();
  const ch=e.target.closest('.ch[data-q]');if(ch){$('#q').value=ch.dataset.q;st.q=ch.dataset.q;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;st.chip=b.dataset.chip;$$('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#chips').addEventListener('scroll',chipArrows,{passive:true});
$('#cl').onclick=()=>$('#chips').scrollBy({left:-$('#chips').clientWidth*.7});
$('#cr').onclick=()=>$('#chips').scrollBy({left:$('#chips').clientWidth*.7});
$('#fb').onclick=()=>{const p=$('#fp');p.hidden=!p.hidden;$('#fb').setAttribute('aria-expanded',!p.hidden)};
$('#fp').addEventListener('click',e=>{const b=e.target.closest('.fopt');if(!b)return;const k=b.dataset.f;st[k]=k==='sort'?b.dataset.val:+b.dataset.val;fpanel();render()});
$('#sf').addEventListener('submit',e=>{e.preventDefault();st.q=$('#q').value;if(document.body.classList.contains('watching'))go('trang-chu');else render()});
$('#q').addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(()=>{if(document.body.classList.contains('watching'))return;st.q=$('#q').value;render()},220)});
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;S.set('st-theme',n)};
const th=S.get('st-theme',null);if(th)document.documentElement.dataset.theme=th;
new IntersectionObserver(es=>{if(es[0].isIntersecting&&!$('#browse').hidden&&shown<list.length)more()},{rootMargin:'800px'}).observe($('#sen'));
addEventListener('hashchange',route);
addEventListener('resize',chipArrows);
i18nStatic();$('#lang').onclick=()=>setLang(LANG==='en'?'vi':'en');
/* PWA: offline support + "install app" button */
if('serviceWorker' in navigator&&isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(()=>{const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;if(standalone)return;
  let ev=null;const w=$('#installWrap'),ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;w.hidden=false});
  addEventListener('appinstalled',()=>{w.hidden=true;ev=null});
  if(ios)w.hidden=false;
  $('#install').onclick=()=>{if(ev){ev.prompt();ev.userChoice.finally(()=>{ev=null;w.hidden=true})}else toast(tr('Trên iPhone/iPad: mở bằng Safari, bấm nút Chia sẻ rồi chọn “Thêm vào MH chính”.'))};
})();
fpanel();
fetch('videos.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  V=d;V.forEach((v,i)=>{v._i=i;v._s=fold([v.t,v.ht,v.c,v.a,v.b,v.at,v.bt].join(' '))});
  SH=shortsPool();buildRec();buildTopics();chips();counts();route();
}).catch(()=>{$('#grid').innerHTML=`<div class="empty"><strong>${tr('Không tải được thư viện video')}</strong>${tr('Tải lại trang để thử lần nữa.')}</div>`});
})();
</script>
